<text x="286" y="103" font-size="12" fill="#333">275 ms</text>
<text x="272" y="137" text-anchor="end" font-size="12">INSERT…SELECT (tiny grant, SPILL)</text>
<rect x="280" y="118" width="2" height="28" fill="#FFC107" rx="3"/>
<text x="287" y="137" font-size="12" fill="#333">320 ms</text>
<text x="272" y="171" text-anchor="end" font-size="12">BulkCopy batch=5000</text>
