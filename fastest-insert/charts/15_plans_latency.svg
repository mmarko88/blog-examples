<text x="288" y="205" font-size="12" fill="#333">564 ms</text>
<text x="272" y="239" text-anchor="end" font-size="12">BulkCopy +checkConstraints</text>
<rect x="280" y="220" width="3" height="28" fill="#00BCD4" rx="3"/>
<text x="288" y="239" font-size="12" fill="#333">570 ms</text>
<text x="272" y="273" text-anchor="end" font-size="12">BulkCopy default (batch=1000)</text>
