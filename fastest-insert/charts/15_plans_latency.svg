<svg xmlns="http://www.w3.org/2000/svg" width="950" height="478" font-family="Segoe UI, Arial, sans-serif">
<rect width="950" height="478" fill="white"/>
<text x="475" y="30" text-anchor="middle" font-size="16" font-weight="bold">Query Plans, Latency & INSERT…SELECT (100k persons)</text>
<text x="272" y="69" text-anchor="end" font-size="12">INSERT ... SELECT ORDER BY</text>
<rect x="280" y="50" width="1" height="28" fill="#8BC34A" rx="3"/>
