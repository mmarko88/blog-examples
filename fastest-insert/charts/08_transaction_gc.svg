<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" font-family="Segoe UI, Arial, sans-serif">
<rect width="800" height="410" fill="white"/>
<text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold">Transaction & GC Tuning (100k persons)</text>
<text x="272" y="69" text-anchor="end" font-size="12">Commit per batch</text>
<rect x="280" y="50" width="394" height="28" fill="#4CAF50" rx="3"/>
<text x="679" y="69" font-size="12" fill="#333">3543 ms</text>
<text x="272" y="103" text-anchor="end" font-size="12">One large txn</text>
<rect x="280" y="84" width="420" height="28" fill="#2196F3" rx="3"/>
<text x="705" y="103" font-size="12" fill="#333">3773 ms</text>
<text x="272" y="137" text-anchor="end" font-size="12">Savepoints per batch</text>
<rect x="280" y="118" width="440" height="28" fill="#FF9800" rx="3"/>
<text x="725" y="137" font-size="12" fill="#333">3949 ms</text>
<text x="272" y="171" text-anchor="end" font-size="12">Serializable isolation</text>
<rect x="280" y="152" width="330" height="28" fill="#9C27B0" rx="3"/>
<text x="615" y="171" font-size="12" fill="#333">2963 ms</text>
<text x="272" y="205" text-anchor="end" font-size="12">Read committed</text>
<rect x="280" y="186" width="338" height="28" fill="#9C27B0" rx="3"/>
<text x="623" y="205" font-size="12" fill="#333">3037 ms</text>
<text x="272" y="239" text-anchor="end" font-size="12">Read uncommitted</text>
<rect x="280" y="220" width="355" height="28" fill="#9C27B0" rx="3"/>
<text x="640" y="239" font-size="12" fill="#333">3189 ms</text>
<text x="272" y="273" text-anchor="end" font-size="12">G1 512m (JDBC)</text>
<rect x="280" y="254" width="355" height="28" fill="#00BCD4" rx="3"/>
<text x="640" y="273" font-size="12" fill="#333">3194 ms</text>
<text x="272" y="307" text-anchor="end" font-size="12">G1 4g (JDBC)</text>
<rect x="280" y="288" width="344" height="28" fill="#00BCD4" rx="3"/>
<text x="629" y="307" font-size="12" fill="#333">3095 ms</text>
<text x="272" y="341" text-anchor="end" font-size="12">Parallel 2g (JDBC)</text>
<rect x="280" y="322" width="378" height="28" fill="#00BCD4" rx="3"/>
<text x="663" y="341" font-size="12" fill="#333">3401 ms</text>
<text x="272" y="375" text-anchor="end" font-size="12">ZGC 4g (JDBC)</text>
<rect x="280" y="356" width="366" height="28" fill="#00BCD4" rx="3"/>
<text x="651" y="375" font-size="12" fill="#333">3291 ms</text>
</svg>