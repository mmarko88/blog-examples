<svg xmlns="http://www.w3.org/2000/svg" width="800" height="342" font-family="Segoe UI, Arial, sans-serif">
<rect width="800" height="342" fill="white"/>
<text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold">Row Size, Compression & Columnstore (JDBC batch)</text>
<text x="272" y="69" text-anchor="end" font-size="12">Narrow (5 cols)</text>
<rect x="280" y="50" width="165" height="28" fill="#4CAF50" rx="3"/>
