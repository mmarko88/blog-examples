<text x="393" y="171" font-size="12" fill="#333">2417 ms</text>
<text x="272" y="205" text-anchor="end" font-size="12">ROW compression</text>
<rect x="280" y="186" width="116" height="28" fill="#00BCD4" rx="3"/>
<text x="401" y="205" font-size="12" fill="#333">2595 ms</text>
<text x="272" y="239" text-anchor="end" font-size="12">PAGE compression</text>
<rect x="280" y="220" width="144" height="28" fill="#9C27B0" rx="3"/>
<text x="429" y="239" font-size="12" fill="#333">3229 ms</text>
