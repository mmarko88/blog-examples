<text x="272" y="103" text-anchor="end" font-size="12">Wide (17 cols)</text>
<rect x="280" y="84" width="232" height="28" fill="#FF9800" rx="3"/>
<text x="517" y="103" font-size="12" fill="#333">3321 ms</text>
<text x="272" y="137" text-anchor="end" font-size="12">LOB (NVARCHAR MAX)
50k rows</text>
<rect x="280" y="118" width="440" height="28" fill="#F44336" rx="3"/>
<text x="725" y="137" font-size="12" fill="#333">6280 ms</text>
<text x="272" y="171" text-anchor="end" font-size="12">No compression</text>
<rect x="280" y="152" width="142" height="28" fill="#2196F3" rx="3"/>
<text x="427" y="171" font-size="12" fill="#333">2033 ms</text>
<text x="272" y="205" text-anchor="end" font-size="12">ROW compression</text>
<rect x="280" y="186" width="161" height="28" fill="#00BCD4" rx="3"/>
<text x="446" y="205" font-size="12" fill="#333">2298 ms</text>
<text x="272" y="239" text-anchor="end" font-size="12">PAGE compression</text>
<rect x="280" y="220" width="178" height="28" fill="#9C27B0" rx="3"/>
<text x="463" y="239" font-size="12" fill="#333">2546 ms</text>
<text x="272" y="273" text-anchor="end" font-size="12">Columnstore 1k</text>
<rect x="280" y="254" width="300" height="28" fill="#795548" rx="3"/>
<text x="585" y="273" font-size="12" fill="#333">4293 ms</text>
<text x="272" y="307" text-anchor="end" font-size="12">Columnstore 5k</text>
<rect x="280" y="288" width="292" height="28" fill="#795548" rx="3"/>
<text x="577" y="307" font-size="12" fill="#333">4181 ms</text>
