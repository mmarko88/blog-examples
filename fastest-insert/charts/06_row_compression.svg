<rect x="280" y="254" width="375" height="28" fill="#795548" rx="3"/>
<text x="660" y="273" font-size="12" fill="#333">8402 ms</text>
<text x="272" y="307" text-anchor="end" font-size="12">Columnstore 5k</text>
