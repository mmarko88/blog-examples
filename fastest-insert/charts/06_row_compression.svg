<rect x="280" y="84" width="311" height="28" fill="#FF9800" rx="3"/>
<text x="596" y="103" font-size="12" fill="#333">6952 ms</text>
<text x="272" y="137" text-anchor="end" font-size="12">LOB (NVARCHAR MAX)
50k rows</text>
<rect x="280" y="118" width="440" height="28" fill="#F44336" rx="3"/>
<text x="725" y="137" font-size="12" fill="#333">9834 ms</text>
