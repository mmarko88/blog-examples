<text x="272" y="103" text-anchor="end" font-size="12">TF610 OFF + TABLOCK</text>
<rect x="280" y="84" width="270" height="28" fill="#2196F3" rx="3"/>
<text x="555" y="103" font-size="12" fill="#333">1843 ms</text>
<text x="272" y="137" text-anchor="end" font-size="12">No index baseline</text>
<rect x="280" y="118" width="294" height="28" fill="#4CAF50" rx="3"/>
<text x="579" y="137" font-size="12" fill="#333">2007 ms</text>
<text x="272" y="171" text-anchor="end" font-size="12">Delayed Durability DISABLED</text>
<rect x="280" y="152" width="295" height="28" fill="#607D8B" rx="3"/>
<text x="580" y="171" font-size="12" fill="#333">2010 ms</text>
<text x="272" y="205" text-anchor="end" font-size="12">Computed cols (1 persisted + 1 non)</text>
<rect x="280" y="186" width="304" height="28" fill="#00BCD4" rx="3"/>
<text x="589" y="205" font-size="12" fill="#333">2073 ms</text>
<text x="272" y="239" text-anchor="end" font-size="12">Filtered index (17% match)</text>
<rect x="280" y="220" width="407" height="28" fill="#8BC34A" rx="3"/>
<text x="692" y="239" font-size="12" fill="#333">2774 ms</text>
<text x="272" y="273" text-anchor="end" font-size="12">Full non-clustered index</text>
<rect x="280" y="254" width="423" height="28" fill="#F44336" rx="3"/>
<text x="708" y="273" font-size="12" fill="#333">2885 ms</text>
<text x="272" y="307" text-anchor="end" font-size="12">INCLUDE index</text>
<rect x="280" y="288" width="435" height="28" fill="#CDDC39" rx="3"/>
<text x="720" y="307" font-size="12" fill="#333">2965 ms</text>
<text x="272" y="341" text-anchor="end" font-size="12">Composite 3-col index</text>
<rect x="280" y="322" width="435" height="28" fill="#FFC107" rx="3"/>
<text x="720" y="341" font-size="12" fill="#333">2966 ms</text>
<text x="272" y="375" text-anchor="end" font-size="12">Delayed Durability FORCED</text>
<rect x="280" y="356" width="440" height="28" fill="#FF5722" rx="3"/>
<text x="725" y="375" font-size="12" fill="#333">2996 ms</text>
</svg>