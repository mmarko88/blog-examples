# Database connection — MS SQL Server required
# Toggle useBulkCopyForBatchInsert for Part 4 benchmarks
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=testdb;encrypt=true;trustServerCertificate=true;useBulkCopyForBatchInsert=false
spring.datasource.username=weblogic
spring.datasource.password=weblogic
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update

